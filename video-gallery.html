    <style>
        .video-card {
            background: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .video-card:hover {
            transform: translateY(-5px);
        }
        .video-card video {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #000;
        }
        .video-info {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #333;
        }
        .view-count {
            color: #e50914; /* Attractive red color for views */
            font-weight: bold;
            font-size: 1.1rem;
        }
        .share-buttons .btn {
            padding: 5px 12px;
            font-size: 14px;
            margin-left: 5px;
            border-radius: 5px;
        }
        .btn-facebook {
            background-color: #1877F2;
            color: white;
            border: none;
        }
        .btn-tiktok {
            background-color: #000000;
            color: white;
            border: 1px solid #333;
        }
        .btn-tiktok:hover, .btn-facebook:hover {
            opacity: 0.8;
            color: white;
        }
    </style>

            <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav mx-auto p-4 p-lg-0">
                    <a href="index.html" class="nav-item nav-link">হোম</a>

                            <a href="testimonial.html" class="dropdown-item">ক্লায়েন্ট রিভিউ</a>

        <div class="page-header pb-5">
            <div class="container text-center py-5">
                <h1 class="display-4 text-uppercase mb-3 animated slideInDown">ভিডিও গ্যালারি</h1>
                <p class="text-white fs-5 mb-4">আমাদের এক্সক্লুসিভ মডেলিং ভিডিওসমূহ উপভোগ করুন এবং শেয়ার করুন</p>
            </div>
        </div>
    </div>
    <div class="container-fluid py-5 bg-secondary">
        <div class="container">
            <div id="loadingSpinner" class="text-center text-primary py-5">
                <div class="spinner-border" style="width: 3rem; height: 3rem;" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
                <p class="mt-3">ভিডিও লোড হচ্ছে...</p>
            </div>
            
            <div class="row" id="dynamicVideoGallery">
                </div>
        </div>
    </div>
    <div class="container-fluid bg-dark text-light footer py-5">
        <div class="container text-center py-5">
            <h1 class="display-4 mb-3 text-white text-uppercase"><i class="fa-regular fa-face-smile me-1"></i>মডেলিং গ্যালারি</h1>
            <p>&copy; <a class="border-bottom" href="#">আপনার ওয়েবসাইটের নাম</a>, সর্বস্বত্ব সংরক্ষিত।</p>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            // গিটহাব রিপোজিটরির এপিআই লিংক (img/videos ফোল্ডার)
            // আপনি গিটহাবে img ফোল্ডারের ভেতর videos নামে একটি ফোল্ডার তৈরি করে সেখানে ভিডিও আপলোড করবেন।
            const apiUrl = "https://api.github.com/repos/economist-bd/modeling/contents/img/videos";
            const galleryContainer = document.getElementById("dynamicVideoGallery");
            const spinner = document.getElementById("loadingSpinner");

            // ইংরেজি সংখ্যাকে বাংলায় রূপান্তর করার ফাংশন
            const convertToBanglaNumber = (num) => {
                const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
                return num.toString().replace(/\d/g, x => banglaDigits[x]);
            };

            // র‍্যান্ডম ভিউ জেনারেট (২ লক্ষ থেকে ৫ লক্ষের মধ্যে)
            const getRandomViews = () => {
                const min = 200000;
                const max = 500000;
                const views = Math.floor(Math.random() * (max - min + 1)) + min;
                // সংখ্যাটিতে কমা বসিয়ে বাংলায় কনভার্ট করা (যেমন: ২,৩৪,৫৬৭)
                let formattedViews = views.toLocaleString('en-IN'); 
                return convertToBanglaNumber(formattedViews);
            };

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("ফোল্ডারটি পাওয়া যায়নি বা খালি।");
                
                const files = await response.json();
                
                // শুধু ভিডিও ফাইল (mp4, webm) ফিল্টার করা
                const videos = files.filter(file => file.name.match(/\.(mp4|webm|ogg)$/i));

                if (videos.length === 0) {
                    spinner.innerHTML = "<p>গ্যালারিতে এখনো কোনো ভিডিও আপলোড করা হয়নি। গিটহাবের img/videos ফোল্ডারে ভিডিও আপলোড করুন।</p>";
                    return;
                }

                spinner.style.display = "none";

                videos.forEach(videoData => {
                    const colDiv = document.createElement("div");
                    colDiv.className = "col-lg-4 col-md-6 wow fadeInUp";

                    const cardDiv = document.createElement("div");
                    cardDiv.className = "video-card";

                    // Video Element (nodownload attribute added to restrict download)
                    const videoElement = document.createElement("video");
                    videoElement.src = videoData.download_url;
                    videoElement.controls = true;
                    videoElement.controlsList = "nodownload"; // হাইড ডাউনলোড বাটন
                    videoElement.oncontextmenu = () => false; // রাইট ক্লিক বন্ধ

                    // Video Info & Share Bar
                    const infoDiv = document.createElement("div");
                    infoDiv.className = "video-info";

                    const viewsSpan = document.createElement("span");
                    viewsSpan.className = "view-count";
                    viewsSpan.innerHTML = `<i class="fa fa-eye me-1"></i> ${getRandomViews()} ভিউ`;

                    const shareDiv = document.createElement("div");
                    shareDiv.className = "share-buttons";

                    // Facebook Share Button
                    const fbShare = document.createElement("a");
                    fbShare.href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(videoData.download_url)}`;
                    fbShare.target = "_blank";
                    fbShare.className = "btn btn-facebook";
                    fbShare.innerHTML = '<i class="fab fa-facebook-f"></i>';
                    fbShare.title = "ফেসবুকে শেয়ার করুন";

                    // TikTok Share Button (Copies link to clipboard as TikTok has no direct web share URL)
                    const tiktokShare = document.createElement("button");
                    tiktokShare.className = "btn btn-tiktok";
                    tiktokShare.innerHTML = '<i class="fab fa-tiktok"></i>';
                    tiktokShare.title = "লিংক কপি করে টিকটকে দিন";
                    tiktokShare.onclick = () => {
                        navigator.clipboard.writeText(videoData.download_url).then(() => {
                            alert("ভিডিওর লিংক কপি হয়েছে! এখন আপনি এটি টিকটকে ব্যবহার করতে পারবেন।");
                        });
                    };

                    shareDiv.appendChild(fbShare);
                    shareDiv.appendChild(tiktokShare);
                    
                    infoDiv.appendChild(viewsSpan);
                    infoDiv.appendChild(shareDiv);

                    cardDiv.appendChild(videoElement);
                    cardDiv.appendChild(infoDiv);
                    colDiv.appendChild(cardDiv);
                    
                    galleryContainer.appendChild(colDiv);
                });

            } catch (error) {
                console.error("Error fetching videos:", error);
                spinner.innerHTML = "<p class='text-danger'>ভিডিও লোড করতে সমস্যা হচ্ছে। দয়া করে কিছুক্ষণ পর আবার চেষ্টা করুন।</p>";
            }
        });
    </script>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>

    <script src="lib/wow/wow.min.js"></script>
