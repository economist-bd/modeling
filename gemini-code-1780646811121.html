<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="utf-8">
    <title>মডেলিং ফটো গ্যালারি</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <link href="img/favicon.ico" rel="icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <style>
        .dynamic-gallery {
            column-count: 3;
            column-gap: 15px;
            padding: 20px 0;
        }
        .gallery-item {
            break-inside: avoid;
            margin-bottom: 15px;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: #1a1a1a;
        }
        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
            opacity: 0.7;
        }
        .download-btn {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .gallery-item:hover .download-btn {
            opacity: 1;
        }
        @media (max-width: 991px) {
            .dynamic-gallery { column-count: 2; }
        }
        @media (max-width: 576px) {
            .dynamic-gallery { column-count: 1; }
            .download-btn { opacity: 1; position: relative; bottom: 0; transform: none; left: 0; width: 100%; border-radius: 0; }
        }
    </style>
</head>

<body>
    <div class="container-fluid p-0">
        <nav class="navbar navbar-expand-lg navbar-dark px-lg-5 bg-dark">
            <a href="index.html" class="navbar-brand ms-4 ms-lg-0">
                <h2 class="mb-0 text-primary text-uppercase"><i class="fa-regular fa-face-smile me-1"></i>মডেলিং গ্যালারি</h2>
            </a>
            <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav mx-auto p-4 p-lg-0">
                    <a href="index.html" class="nav-item nav-link">হোম</a>
                    <a href="about.html" class="nav-item nav-link">আমাদের সম্পর্কে</a>
                    <a href="service.html" class="nav-item nav-link">সেবাসমূহ</a>
                    <div class="nav-item dropdown">
                        <a href="#" class="nav-link dropdown-toggle active" data-bs-toggle="dropdown">পেজসমূহ</a>
                        <div class="dropdown-menu m-0">
                            <a href="gallery.html" class="dropdown-item active">ফটো গ্যালারি</a>
                            <a href="team.html" class="dropdown-item">আমাদের মডেল</a>
                            <a href="testimonial.html" class="dropdown-item">ক্লায়েন্ট রিভিউ</a>
                        </div>
                    </div>
                    <a href="contact.html" class="nav-item nav-link">যোগাযোগ</a>
                </div>
            </div>
        </nav>

        <div class="page-header pb-5">
            <div class="container text-center py-5">
                <h1 class="display-4 text-uppercase mb-3 animated slideInDown">ফটো গ্যালারি</h1>
                <p class="text-white fs-5 mb-4">বিশ্বের সেরা মডেলদের এক্সক্লুসিভ কালেকশন দেখুন এবং ডাউনলোড করুন</p>
            </div>
        </div>
    </div>
    <div class="container-fluid py-5 bg-secondary">
        <div class="container">
            <div id="loadingSpinner" class="text-center text-primary py-5">
                <div class="spinner-border" style="width: 3rem; height: 3rem;" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
                <p class="mt-3">ছবি লোড হচ্ছে...</p>
            </div>
            
            <div id="dynamicGallery" class="dynamic-gallery">
                </div>
        </div>
    </div>
    <div class="container-fluid bg-dark text-light footer py-5">
        <div class="container text-center py-5">
            <h1 class="display-4 mb-3 text-white text-uppercase"><i class="fa-regular fa-face-smile me-1"></i>মডেলিং গ্যালারি</h1>
            <p>&copy; <a class="border-bottom" href="#">আপনার ওয়েবসাইটের নাম</a>, সর্বস্বত্ব সংরক্ষিত।</p>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            // আপনার গিটহাব রিপোজিটরির এপিআই লিংক (img/photos ফোল্ডার)
            const apiUrl = "https://api.github.com/repos/economist-bd/modeling/contents/img/photos";
            const galleryContainer = document.getElementById("dynamicGallery");
            const spinner = document.getElementById("loadingSpinner");

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("ফোল্ডারটি পাওয়া যায়নি বা খালি।");
                
                const files = await response.json();
                
                // শুধু ছবি ফিল্টার করা
                const images = files.filter(file => file.name.match(/\.(jpe?g|png|gif|webp)$/i));

                if (images.length === 0) {
                    spinner.innerHTML = "<p>গ্যালারিতে এখনো কোনো ছবি আপলোড করা হয়নি।</p>";
                    return;
                }

                spinner.style.display = "none"; // স্পিনার বন্ধ করা

                images.forEach(imgData => {
                    const itemDiv = document.createElement("div");
                    itemDiv.className = "gallery-item wow fadeInUp";

                    const imgElement = document.createElement("img");
                    imgElement.src = imgData.download_url; // সরাসরি ছবি লোড হবে
                    imgElement.alt = imgData.name;
                    imgElement.loading = "lazy";

                    const downloadBtn = document.createElement("button");
                    downloadBtn.className = "btn btn-primary px-4 download-btn";
                    downloadBtn.innerHTML = '<i class="fa fa-download me-2"></i>ডাউনলোড';
                    
                    // ডাউনলোড ফাংশনালিটি (ক্রস-অরিজিন ইস্যু ফিক্সড)
                    downloadBtn.onclick = async () => {
                        downloadBtn.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i>ডাউনলোড হচ্ছে...';
                        try {
                            const res = await fetch(imgData.download_url);
                            const blob = await res.blob();
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement("a");
                            a.href = url;
                            a.download = imgData.name;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            window.URL.revokeObjectURL(url);
                        } catch (error) {
                            console.error("Download failed:", error);
                            window.open(imgData.download_url, '_blank');
                        }
                        downloadBtn.innerHTML = '<i class="fa fa-download me-2"></i>ডাউনলোড';
                    };

                    itemDiv.appendChild(imgElement);
                    itemDiv.appendChild(downloadBtn);
                    galleryContainer.appendChild(itemDiv);
                });

            } catch (error) {
                console.error("Error fetching images:", error);
                spinner.innerHTML = "<p class='text-danger'>ছবি লোড করতে সমস্যা হচ্ছে। দয়া করে কিছুক্ষণ পর আবার চেষ্টা করুন।</p>";
            }
        });
    </script>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
